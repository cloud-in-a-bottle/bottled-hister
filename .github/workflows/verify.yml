name: Verify package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n entrypoint.sh
      - name: Build pinned image
        run: docker build -t bottled-hister:test .
      - name: Test indexing and persistence within resource limits
        run: python3 tests/smoke.py
